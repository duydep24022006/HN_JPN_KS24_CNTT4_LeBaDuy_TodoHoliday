<!doctype html>
<html lang="en">
<head>
    <title>Todo App</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          crossorigin="anonymous">
</head>
<body>
<h2 class="mb-3" th:text="#{listTitle}"></h2>

<a th:href="@{/todo/new}" class="btn btn-primary mb-3" th:text="#{add}"></a>

<table class="table table-striped table-bordered">
    <thead class="thead-dark">
    <tr>
        <th>#</th>
        <th th:text="#{content}"></th>
        <th th:text="#{dueDate}"></th>
        <th th:text="#{status}"></th>
        <th th:text="#{priority}"></th>
        <th th:text="#{actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="todo, iterStat : ${todos}">
        <td th:text="${iterStat.index + 1}"></td>
        <td th:text="${todo.content}"></td>
        <td th:text="${todo.dueDate}"></td>
        <td th:text="${todo.status}"></td>
        <td th:text="${todo.priority}"></td>
        <td>
            <a th:href="@{/todo/edit/{id}(id=${todo.id})}" class="btn btn-sm btn-warning" th:text="#{edit}"></a>
            <a th:href="@{/todo/delete/{id}(id=${todo.id})}"
               class="btn btn-sm btn-danger"
               th:text="#{delete}"
               onclick="return confirm('#{confirmDelete}')"></a>
        </td>
    </tr>
    </tbody>
</table>
<div class="mt-3">
    <a href="?lang=vi">Tiếng Việt</a> | <a href="?lang=en">English</a>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
