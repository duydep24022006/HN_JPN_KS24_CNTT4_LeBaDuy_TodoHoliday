<!doctype html>
<html lang="en">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>

<div class="container mt-4">
    <h2 th:text="${id} != null ? 'Cập nhật công việc' : 'Thêm mới công việc'"></h2>

    <form th:action="${id} != null ? @{/todo/update/{id}(id=${id})} : @{/todo/add}"
          th:object="${todoDto}" method="post">

        <!-- hidden ID chỉ khi update -->
        <input type="hidden" th:if="${id} != null" th:field="*{id}"/>

        <div class="form-group">
            <label for="content">Nội dung</label>
            <input type="text" th:field="*{content}" id="content" class="form-control"/>
            <div class="text-danger" th:errors="*{content}"></div>
        </div>

        <div class="form-group">
            <label for="dueDate">Ngày hết hạn</label>
            <input type="date" th:value="${#temporals.format(todoDto.dueDate, 'yyyy-MM-dd')}"
                   name="dueDate" class="form-control"/>
            <div class="text-danger" th:errors="*{dueDate}"></div>
        </div>

        <div class="form-group">
            <label for="status">Trạng thái</label>
            <select th:field="*{status}" id="status" class="form-control">
                <option value="PENDING">PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="COMPLETED">COMPLETED</option>
            </select>
            <div class="text-danger" th:errors="*{status}"></div>
        </div>

        <div class="form-group">
            <label for="priority">Độ ưu tiên</label>
            <select th:field="*{priority}" id="priority" class="form-control">
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
            </select>
            <div class="text-danger" th:errors="*{priority}"></div>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${id} != null ? 'Cập nhật' : 'Thêm mới'"></button>
    </form>
</div>


</form>
</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
